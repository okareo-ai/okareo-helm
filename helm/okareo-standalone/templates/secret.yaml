{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "okareo-standalone.secretName" . }}
  labels:
    {{- include "okareo-standalone.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.secrets.dbUser | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  DB_NAME: {{ .Values.secrets.dbName | quote }}
  DATABASE_URL: {{ include "okareo-standalone.databaseUrl" . | quote }}
  TENANT_DB: {{ include "okareo-standalone.tenantDb" . | quote }}
  EVAL_API_KEY: {{ .Values.secrets.evalApiKey | quote }}
  VLLM_API_KEY: {{ .Values.secrets.vllmApiKey | quote }}
  FRONTEGG_API_KEY: {{ .Values.secrets.fronteggApiKey | quote }}
  FRONTEGG_DOMAIN: {{ .Values.secrets.fronteggDomain | quote }}
  FRONTEGG_API_GATEWAY_URL: {{ .Values.secrets.fronteggApiGatewayUrl | quote }}
  FRONTEGG_WEBHOOK_KEY: {{ .Values.secrets.fronteggWebhookKey | quote }}
  FRONTEGG_PUBLIC_KEY: {{ .Values.secrets.fronteggPublicKey | quote }}
  FRONTEGG_CLIENT_ID: {{ .Values.secrets.fronteggClientId | quote }}
  SSO_CLIENT_SECRET: {{ .Values.secrets.ssoClientSecret | quote }}
{{- end }}
