{{- if .Values.frontend.enabled }}
{{- if and .Values.customCa.enabled (not .Values.customCa.secretName) -}}
{{- fail "customCa.enabled=true requires customCa.secretName to be set" -}}
{{- end -}}
{{- $proxyEnabledForFrontend := and .Values.proxy.enabled .Values.proxy.components.frontend -}}
{{- $customCaEnabled := and .Values.customCa.enabled .Values.customCa.secretName -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "okareo-standalone.fullname" . }}-frontend
  labels:
    {{- include "okareo-standalone.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "okareo-standalone.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "okareo-standalone.fullname" . }}-frontend
  labels:
    {{- include "okareo-standalone.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  {{- with .Values.frontend.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "okareo-standalone.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "okareo-standalone.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          command: ["node", "server.js"]
          ports:
            - containerPort: {{ .Values.frontend.service.port }}
          env:
            - name: OKAREO_AIRGAP_TENANTS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "okareo-standalone.fullname" . }}-config
                  key: FRONTEND_TENANTS_JSON
            - name: OKAREO_API_GATEWAY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "okareo-standalone.fullname" . }}-config
                  key: OKAREO_API_GATEWAY
            - name: OKAREO_APP_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "okareo-standalone.fullname" . }}-config
                  key: OKAREO_APP_DOMAIN
            {{- if .Values.frontend.edgeHeaderBufferTuning.enabled }}
            - name: CLIENT_HEADER_BUFFER_SIZE
              value: {{ .Values.frontend.edgeHeaderBufferTuning.clientHeaderBufferSize | quote }}
            - name: LARGE_CLIENT_HEADER_BUFFERS
              value: {{ .Values.frontend.edgeHeaderBufferTuning.largeClientHeaderBuffers | quote }}
            {{- end }}
            {{- if $proxyEnabledForFrontend }}
            {{- with .Values.proxy.httpProxy }}
            - name: HTTP_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.proxy.httpsProxy }}
            - name: HTTPS_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.proxy.noProxy }}
            - name: NO_PROXY
              value: {{ . | quote }}
            {{- if $.Values.proxy.includeLowercase }}
            - name: no_proxy
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $customCaEnabled }}
            {{- if .Values.customCa.setSslCertFileEnv }}
            - name: SSL_CERT_FILE
              value: {{ .Values.customCa.mountPath | quote }}
            {{- end }}
            {{- if .Values.customCa.setNodeExtraCaCertsEnv }}
            - name: NODE_EXTRA_CA_CERTS
              value: {{ .Values.customCa.mountPath | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.frontend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.frontend.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.frontend.extraVolumeMounts $customCaEnabled }}
          volumeMounts:
            {{- if $customCaEnabled }}
            - name: custom-ca-bundle
              mountPath: {{ .Values.customCa.mountPath | quote }}
              subPath: {{ .Values.customCa.secretKey | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.frontend.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      {{- if or .Values.frontend.extraVolumes $customCaEnabled }}
      volumes:
        {{- if $customCaEnabled }}
        - name: custom-ca-bundle
          secret:
            secretName: {{ .Values.customCa.secretName | quote }}
            items:
              - key: {{ .Values.customCa.secretKey | quote }}
                path: {{ .Values.customCa.secretKey | quote }}
        {{- end }}
        {{- with .Values.frontend.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
