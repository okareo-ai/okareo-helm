apiVersion: v1
kind: Service
metadata:
  name: {{ include "okareo-redis-ha.sentinelServiceName" . }}
  labels:
    {{- include "okareo-redis-ha.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.sentinel.type }}
  ports:
    - name: sentinel
      port: {{ .Values.service.sentinel.port }}
      targetPort: sentinel
  selector:
    {{- include "okareo-redis-ha.selectorLabels" . | nindent 4 }}
