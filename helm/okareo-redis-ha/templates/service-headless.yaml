apiVersion: v1
kind: Service
metadata:
  name: {{ include "okareo-redis-ha.headlessServiceName" . }}
  labels:
    {{- include "okareo-redis-ha.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: redis
      port: {{ .Values.service.headless.port }}
      targetPort: redis
  selector:
    {{- include "okareo-redis-ha.selectorLabels" . | nindent 4 }}
