# Frontend cluster overlay for host-based cross-cluster routing.
# - app host routes to in-cluster frontend service
# - api host routes to backend cluster services LB via local upstream service/endpoints
# - nats external route is provided via ingress-nginx TCP mapping config map

frontend:
  enabled: true
  replicaCount: 3

services:
  enabled: false

redis:
  enabled: false

nats:
  enabled: false

db:
  enabled: false

crossClusterApi:
  enabled: true
  serviceName: okareo-api-external
  servicePort: 8000
  endpointIP: 4.246.32.234

crossClusterNats:
  enabled: true
  serviceName: okareo-nats-external
  servicePort: 4222
  endpointIP: 172.193.226.182

ingressNginxTcp:
  enabled: true
  namespace: ingress-nginx
  configMapName: tcp-services

ingress:
  frontend:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    hosts:
      - host: app.52-225-50-10.nip.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - app.52-225-50-10.nip.io
        secretName: okareo-le-tls-frontend
  services:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "7200"
    hosts:
      - host: api.52-225-50-10.nip.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - api.52-225-50-10.nip.io
        secretName: okareo-le-tls-api
