apiVersion: v1
kind: Secret
metadata:
  name: okareo-app-secrets
  namespace: okareo
type: Opaque
stringData:
  DB_USER: "<db-user>"
  DB_PASSWORD: "<db-password>"
  DB_NAME: "<db-name>"
  DATABASE_URL: "postgresql+psycopg2://<db-user>:<db-password>@<db-host>:5432/<db-name>?sslmode=require"
  TENANT_DB: "postgresql+psycopg2://<db-user>:<db-password>@<db-host>:5432/<db-name>?sslmode=require"
  EVAL_API_KEY: "<eval-api-key>"
  VLLM_API_KEY: "sk-none"
  FRONTEGG_API_KEY: "<frontegg-api-key>"
  FRONTEGG_DOMAIN: "<frontegg-domain>"
  FRONTEGG_API_GATEWAY_URL: "<frontegg-api-gateway-url>"
  FRONTEGG_WEBHOOK_KEY: "<frontegg-webhook-key>"
  FRONTEGG_PUBLIC_KEY: "<frontegg-public-key>"
  FRONTEGG_CLIENT_ID: "<frontegg-client-id>"
  OKAREO_JWT_PRIVATE_KEY: "<okareo-jwt-private-key>"
  SSO_CLIENT_SECRET: "<sso-client-secret>"
