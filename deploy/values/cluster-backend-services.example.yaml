# Backend cluster overlay: services only from Okareo chart.
# Deploy Redis HA and NATS as separate Helm releases.
# IMPORTANT: Before deploying, replace nats.external.url with your reachable
# NATS endpoint (for example a DNS name or IP exposed via ingress TCP 4222).

frontend:
  enabled: false

services:
  enabled: true
  runtimeSecrets:
    source: secretKeyRef
  replicaCount: 2
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  nodeSelector:
    agentpool: servicepool
  tolerations:
    - key: dedicated
      operator: Equal
      value: backend
      effect: NoSchedule
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: services
  resources:
    requests:
      cpu: 6000m
      memory: 28000Mi
    limits:
      cpu: 7000m
      memory: 30000Mi

redis:
  enabled: false
  external:
    host: okareo-redis-ha-rw
    port: 6379

nats:
  enabled: false
  external:
    enabled: true
    # Replace with your own NATS endpoint before deploy.
    url: "nats://<NATS_EXTERNAL_IP_OR_DNS>:4222"
  server:
    url: nats://okareo-nats:4222

db:
  enabled: false

ingress:
  frontend:
    enabled: false
  services:
    enabled: false
